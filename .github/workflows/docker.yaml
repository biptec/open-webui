name: Build release container image

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release
        uses: actions/checkout@v5

      - name: Resolve release tags
        id: release
        shell: bash
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "::error::Run this workflow against a release tag. Current ref: ${GITHUB_REF}"
            exit 1
          fi

          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != v* ]]; then
            echo "::error::Expected a v-prefixed release tag, got: ${tag}"
            exit 1
          fi

          version="${tag#v}"
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

          {
            echo 'tags<<EOF'
            echo "${image}:${tag}"
            echo "${image}:${version}"
            if [[ "${PRERELEASE:-false}" != "true" ]]; then
              echo "${image}:latest"
            fi
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CI Dockerfile
        shell: bash
        run: |
          awk '
            /^FROM --platform=\$BUILDPLATFORM node:/ {
              print
              print "ENV NODE_OPTIONS=\"--max-old-space-size=12288\""
              next
            }
            { print }
          ' Dockerfile > "${RUNNER_TEMP}/Dockerfile"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
          build-args: |
            BUILD_HASH=${{ github.sha }}

      - name: Verify published image
        shell: bash
        run: |
          docker buildx imagetools inspect \
            "${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}"
