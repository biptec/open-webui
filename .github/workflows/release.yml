# -----------------------------------------------------------------------------
# Release - Create GitHub release from CHANGELOG and trigger the Docker build.
# Runs only when package.json changes, and publishes only when its version changes.
# -----------------------------------------------------------------------------
name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect package version change
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          current="$(jq -r '.version' package.json)"
          previous=""

          if [[ -n "${BEFORE_SHA}" ]] &&
             [[ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]] &&
             git cat-file -e "${BEFORE_SHA}:package.json" 2>/dev/null; then
            previous="$(git show "${BEFORE_SHA}:package.json" | jq -r '.version')"
          fi

          echo "version=${current}" >> "${GITHUB_OUTPUT}"

          if [[ -n "${previous}" && "${current}" == "${previous}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "package.json changed, but version stayed at ${current}; skipping release"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "package version changed: ${previous:-unknown} -> ${current}"
          fi

  publish:
    needs: detect-version
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract release notes from CHANGELOG
        run: |
          VER="${{ needs.detect-version.outputs.version }}"
          awk "/^## \\[${VER}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" \
            CHANGELOG.md > /tmp/release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" &>/dev/null; then
            echo "Release v${VERSION} already exists - skipping creation"
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Archive source
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: |
            .
            !.git

      - name: Trigger Docker build
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker.yaml',
              ref: 'v${{ needs.detect-version.outputs.version }}',
            })
